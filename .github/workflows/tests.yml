name: Tests

on:
  pull_request:
  schedule:
    # 01:00 UTC, which is 03:00 in Europe/Kyiv.
    - cron: '0 1 * * *'

jobs:
  lint:
    if: github.event_name == 'pull_request'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  smoke:
    needs: lint
    if: github.event_name == 'pull_request'
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: tests
        run: npm run test:smoke
        continue-on-error: true
      - name: Set up Java
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Allure report
        if: always()
        run: npm run allure:report
      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            allure-report/
            allure-results/
            playwright-report/
            test-results/
          retention-days: 7
      - name: Fail when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1

  regression:
    if: github.event_name == 'schedule'
    name: Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: tests
        run: npm run test:regression
        continue-on-error: true
      - name: Set up Java
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Allure report
        if: always()
        run: npm run allure:report
      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            allure-report/
            allure-results/
            playwright-report/
            test-results/
          retention-days: 14
      - name: Fail when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
